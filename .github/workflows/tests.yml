name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The embedding model (all-MiniLM-L6-v2) is downloaded from Hugging Face on
      # first use; cache it so every run does not re-download it.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      # CPU-only torch wheel: the default Linux wheel pulls several GB of CUDA
      # libraries that tests never use.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # No secrets are configured: tests run against the public development key
      # (see README, Known limitations) and need no Anthropic API key.
      - name: Run tests
        run: pytest -v
